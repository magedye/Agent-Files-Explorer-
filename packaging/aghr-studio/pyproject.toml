[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aghr-studio"
version = "0.1.0.dev20261025+win.3"
description = "Internal AGHR Governance Studio Draft candidate; Windows local profile"
requires-python = ">=3.12,<3.13"
license = {text = "PROVISIONAL internal candidate; public release not authorized. Bundled engine licenses retained separately."}
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0", "jsonschema-specifications==2025.9.1", "referencing==0.37.0", "rpds-py==0.30.0", "attrs==25.4.0", "typing-extensions==4.15.0"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.12"]

[project.scripts]
aghr-studio = "aghr_studio:main"

[tool.hatch.build]
ignore-vcs = true
include = ["aghr_studio/**"]

[tool.hatch.build.targets.wheel]
packages = ["aghr_studio"]
