<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مستكشف المهارات — Skill Explorer</title>
    <script>
      // تطبيق النمط قبل أول رسم لتجنب وميض الوضع الفاتح
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Restore language and direction before the first paint.
      try {
        var locale = localStorage.getItem("aghr.locale") === "en" ? "en" : "ar";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "en" ? "ltr" : "rtl";
        document.title = locale === "en" ? "AGHR Governance Studio" : "استوديو حوكمة الوكلاء — AGHR";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
