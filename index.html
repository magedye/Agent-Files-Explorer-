<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
    <title>مستكشف المهارات — Skill Explorer</title>
    <script>
      // تطبيق النمط قبل أول رسم لتجنب وميض الوضع الفاتح
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Restore language and direction before the first paint.
      try {
        var locale = localStorage.getItem("aghr.locale") === "en" ? "en" : "ar";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "en" ? "ltr" : "rtl";
        document.title = locale === "en" ? "AGHR Governance Studio" : "استوديو حوكمة الوكلاء — AGHR";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
